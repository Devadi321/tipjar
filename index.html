<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TipJar — Support creators directly via UPI</title>
<meta name="description" content="TipJar lets fans tip Indian creators directly over UPI. No middlemen, no cuts.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://vxszwegrpzrzbbwqyovw.supabase.co">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #FFF8F0; color: #2D1B0E; line-height: 1.5; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }
  header.brand { text-align: center; padding: 28px 0 8px; }
  header.brand h1 { font-size: 34px; letter-spacing: -0.5px; }
  header.brand h1 .jar { color: #EA580C; }
  header.brand p { color: #8a6d4b; margin-top: 4px; }
  .card { background: #fff; border: 1px solid #f0e2cd; border-radius: 16px;
          padding: 20px; margin-top: 16px; box-shadow: 0 2px 10px rgba(120,70,10,.06); }
  .card h2 { font-size: 20px; margin-bottom: 6px; }
  .muted { color: #8a6d4b; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #5c4326; }
  input, textarea { width: 100%; padding: 12px; border: 1.5px solid #e8d5b5; border-radius: 10px;
                    font-size: 16px; background: #fffdf9; }
  input:focus, textarea:focus { outline: none; border-color: #EA580C; }
  .amt-wrap { position: relative; }
  .amt-wrap .cur { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-weight: 700; font-size: 18px; color: #EA580C; pointer-events: none; }
  .amt-wrap input { padding-left: 38px; font-size: 18px; font-weight: 700; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 12px;
         background: #EA580C; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: #fff; color: #EA580C; border: 2px solid #EA580C; }
  .btn:disabled { opacity: .5; cursor: default; }
  .err { background: #fde8e8; color: #b91c1c; border-radius: 10px; padding: 10px 12px;
         font-size: 14px; margin-top: 12px; display: none; }
  .ok { background: #e6f9ec; color: #166534; border-radius: 10px; padding: 10px 12px;
        font-size: 14px; margin-top: 12px; display: none; word-break: break-all; }
  .steps { display: flex; gap: 8px; margin-top: 14px; }
  .step { flex: 1; background: #fff; border: 1px solid #f0e2cd; border-radius: 12px;
          padding: 12px 8px; text-align: center; font-size: 13px; }
  .step b { display: block; font-size: 22px; margin-bottom: 4px; }
  .profile { text-align: center; padding: 10px 0; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: #EA580C; color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: 700; }
  .profile h2 { margin-top: 10px; font-size: 24px; }
  .goalbar { height: 14px; background: #f3e6cf; border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .goalbar > div { height: 100%; background: linear-gradient(90deg, #F59E0B, #EA580C);
                   border-radius: 99px; transition: width .6s; }
  .goalnums { display: flex; justify-content: space-between; font-size: 14px; margin-top: 6px; color: #8a6d4b; }
  .goalnums b { color: #2D1B0E; }
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .amt { border: 2px solid #e8d5b5; background: #fffdf9; border-radius: 12px; padding: 12px 4px;
         font-size: 17px; font-weight: 700; cursor: pointer; text-align: center; }
  .amt.sel { border-color: #EA580C; background: #fff3e6; color: #EA580C; }
  #qrbox { display: flex; justify-content: center; padding: 16px 0 4px; }
  #qrbox img, #qrbox canvas { border-radius: 8px; }
  .wallitem { border-top: 1px solid #f3e6cf; padding: 10px 2px; font-size: 15px; }
  .wallitem:first-of-type { border-top: none; }
  .wallitem .who { font-weight: 700; }
  .wallitem .amt2 { color: #EA580C; font-weight: 700; }
  .wallitem .msg { color: #8a6d4b; font-size: 14px; }
  .wallitem .when { color: #b99c72; font-size: 12px; }
  .center { text-align: center; }
  .backlink { display: inline-block; margin-top: 18px; color: #8a6d4b; font-size: 14px; text-decoration: none; }
  footer { text-align: center; color: #b99c72; font-size: 13px; margin-top: 34px; }
  footer a { color: #EA580C; text-decoration: none; font-weight: 600; }
  .hidden { display: none !important; }
  .code { background: #2D1B0E; color: #ffd9a0; font-family: monospace; font-size: 22px;
          letter-spacing: 3px; text-align: center; padding: 12px; border-radius: 10px; margin-top: 10px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px;
         margin-left: 6px; vertical-align: middle; }
  .tag.wait { background: #fdf0d5; color: #92610f; }
  .tag.ok { background: #e6f9ec; color: #166534; }
  .wallitem.newtip { animation: newtip 1.8s ease; border-radius: 10px; }
  @keyframes newtip { 0% { background: #fff3e6; } 100% { background: transparent; } }
  #celebrate { position: fixed; inset: 0; background: rgba(45,27,14,.93); z-index: 50; overflow: hidden;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #celebrate .cjar { font-size: 92px; animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  #celebrate h2 { color: #fff; font-size: 28px; margin-top: 10px; }
  #celebrate p { color: #ffd9a0; margin-top: 8px; font-size: 15px; }
  .coin, .confetti { position: absolute; top: -40px; animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards; }
  .coin { font-size: 26px; }
  .confetti { width: 9px; height: 15px; opacity: .95; }
  @keyframes fall { to { transform: translateY(112vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <h1>🫙 <span class="jar">TipJar</span></h1>
    <p>Tip Indian creators directly over UPI. Zero cuts, zero middlemen.</p>
  </header>
  <div id="app"><p class="center muted">Loading…</p></div>
  <footer>Made for creators, by a creator. <a href="#/">Create your page</a></footer>
</div>

<script>
var SUPABASE_URL = 'https://vxszwegrpzrzbbwqyovw.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_xnWsueFiFLyvaJF9pFk3_A_5o5TzN8L';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var app = document.getElementById('app');
var pollTimer = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function rs(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
function timeAgo(iso) {
  var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function showErr(id, msg) { var e = document.getElementById(id); e.textContent = msg; e.style.display = 'block'; }
function hideErr(id) { document.getElementById(id).style.display = 'none'; }

/* ---------- router ---------- */
window.addEventListener('hashchange', route);
function route() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  var h = location.hash || '#/';
  var cm = h.match(/^#\/confirm\/([A-Za-z0-9]+)$/);
  if (cm) return renderConfirm(cm[1]);
  var m = h.match(/^#\/([a-z0-9-]+)$/);
  if (m) renderCreator(m[1]);
  else renderHome();
}

/* ---------- home + signup ---------- */
function renderHome() {
  app.innerHTML =
    '<div class="card"><h2>Create your tip page</h2>' +
    '<p class="muted">Two minutes. Fans pay straight to your UPI — we never touch the money.</p>' +
    '<label>Username (your page link)</label><input id="f-user" placeholder="adithyan" maxlength="30">' +
    '<label>Display name</label><input id="f-name" placeholder="Adithyan" maxlength="60">' +
    '<label>Bio</label><input id="f-bio" placeholder="I make conspiracy reels" maxlength="140">' +
    '<label>Your UPI ID (tips go here)</label><input id="f-upi" placeholder="name@okhdfc" maxlength="60">' +
    '<label>Goal title (optional)</label><input id="f-goal" placeholder="New mic for streams" maxlength="80">' +
    '<label>Goal amount ₹ (optional)</label><input id="f-goalamt" inputmode="numeric" placeholder="5000" maxlength="9">' +
    '<div class="err" id="e1"></div><div class="ok" id="o1"></div>' +
    '<button class="btn" id="b-create" onclick="doCreate()">Create my page</button></div>' +
    '<div class="steps"><div class="step"><b>1</b>Create your page</div>' +
    '<div class="step"><b>2</b>Share your link</div>' +
    '<div class="step"><b>3</b>Get tipped over UPI</div></div>' +
    '<p class="center muted" style="margin-top:14px">Want to see one first? <a href="#/demo" style="color:#EA580C;font-weight:600">Open the demo page</a></p>';
}
function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
}
async function doCreate() {
  hideErr('e1'); document.getElementById('o1').style.display = 'none';
  var username = slugify(document.getElementById('f-user').value);
  var display_name = document.getElementById('f-name').value.trim();
  var bio = document.getElementById('f-bio').value.trim();
  var upi_id = document.getElementById('f-upi').value.trim();
  var goal_title = document.getElementById('f-goal').value.trim();
  var goal_amount = parseInt(document.getElementById('f-goalamt').value.replace(/\D/g, ''), 10);
  if (!/^[a-z0-9-]{3,30}$/.test(username)) return showErr('e1', 'Username needs 3–30 characters: letters, numbers, hyphens.');
  if (!display_name) return showErr('e1', 'Display name is required.');
  if (!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi_id)) return showErr('e1', 'That UPI ID looks off — it should look like name@okhdfc.');
  var btn = document.getElementById('b-create'); btn.disabled = true; btn.textContent = 'Creating…';
  try {
    var row = { username: username, display_name: display_name, bio: bio || null,
                upi_id: upi_id, goal_title: goal_title || null,
                goal_amount: isNaN(goal_amount) ? null : goal_amount };
    var res = await sb.from('creators').insert(row).select('id,username').single();
    if (res.error) throw res.error;
    var token = '';
    try {
      var bytes = new Uint8Array(12);
      crypto.getRandomValues(bytes);
      for (var bi = 0; bi < bytes.length; bi++) token += ('0' + bytes[bi].toString(16)).slice(-2);
      await sb.rpc('set_creator_token', { p_creator_id: res.data.id, p_token: token });
    } catch (e2) { token = ''; }
    var url = location.origin + location.pathname + '#/' + res.data.username;
    var clink = location.origin + location.pathname + '#/confirm/' + token;
    var o = document.getElementById('o1');
    o.innerHTML = 'Your page is live:<br><a href="#/' + esc(res.data.username) + '" style="color:#166534;font-weight:700">' + esc(url) + '</a>' +
      (token ? '<br><br><b>Save your confirmation link</b> — supporters\' tips wait for your one-tap confirmation here (no login needed). Keep it private:<br>' + esc(clink) : '');
    o.style.display = 'block';
    btn.textContent = 'Done ✓';
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Create my page';
    if (err && err.code === '23505') showErr('e1', 'That username is taken — try another.');
    else showErr('e1', 'Something went wrong. Please try again.');
  }
}

/* ---------- creator page ---------- */
var currentCreator = null, currentTips = [], selAmount = 0;

async function renderCreator(username) {
  app.innerHTML = '<p class="center muted">Loading…</p>';
  var timedOut = false;
  var timer = setTimeout(function () {
    timedOut = true;
    app.innerHTML = '<div class="card center"><h2>Taking too long…</h2>' +
      '<p class="muted">TipJar is taking longer than usual. Check your connection and try again.</p>' +
      '<button class="btn" onclick="renderCreator(\'' + esc(username) + '\')">Retry</button>' +
      '<a class="backlink" href="#/">← Create your page</a></div>';
  }, 10000);
  try {
    var res = await sb.from('creators').select('*').eq('username', username).single();
    clearTimeout(timer);
    if (timedOut) return;
    if (res.error || !res.data) throw new Error('notfound');
    currentCreator = res.data;
    drawCreator();
    await refreshTips();
    pollTimer = setInterval(refreshTips, 15000);
  } catch (e) {
    clearTimeout(timer);
    if (timedOut) return;
    app.innerHTML = '<div class="card center"><h2>Page not found</h2>' +
      '<p class="muted">No creator with that username yet.</p>' +
      '<a class="backlink" href="#/">← Create your page</a></div>';
  }
}

function drawCreator() {
  var c = currentCreator;
  var initial = esc((c.display_name || '?').trim().charAt(0).toUpperCase());
  app.innerHTML =
    '<div class="card"><div class="profile"><div class="avatar">' + initial + '</div>' +
    '<h2>' + esc(c.display_name) + '</h2>' +
    (c.bio ? '<p class="muted">' + esc(c.bio) + '</p>' : '') + '</div>' +
    (c.goal_amount ? '<div style="margin-top:6px"><div class="goalnums"><span><b id="g-raised">₹0</b> confirmed</span><span>Goal: <b>' + rs(c.goal_amount) + '</b>' + (c.goal_title ? ' · ' + esc(c.goal_title) : '') + '</span></div>' +
    '<div class="goalbar"><div id="g-bar" style="width:0%"></div></div><div class="muted" id="g-pending" style="font-size:13px;margin-top:2px"></div></div>' : '') +
    '</div>' +
    '<div class="card"><h2>Send a tip</h2><p class="muted">Pick an amount — it goes straight to ' + esc(c.display_name) + '’s UPI.</p>' +
    '<div class="amounts">' +
    [49, 99, 199].map(function (a) {
      return '<div class="amt" data-a="' + a + '" onclick="pickAmt(' + a + ',this)">₹' + a + '</div>';
    }).join('') + '</div>' +
    '<label>Or custom amount</label><div class="amt-wrap"><span class="cur">₹</span><input id="t-custom" inputmode="numeric" placeholder="250" maxlength="6" oninput="customAmt(this)"></div>' +
    '<label>Your name</label><input id="t-name" placeholder="Anonymous fan" maxlength="40">' +
    '<label>Message (optional)</label><input id="t-msg" placeholder="Love your work!" maxlength="140">' +
    '<div class="err" id="e2"></div>' +
    '<button class="btn" id="b-qr" onclick="showQR()">Continue →</button></div>' +
    '<div class="card hidden" id="paycard"><h2>Scan to pay ' + '<span id="qr-amt"></span></h2>' +
    '<div id="qrbox"></div>' +
    '<p class="muted center">Scan with GPay / PhonePe / Paytm.<br>Money goes directly to ' + esc(c.display_name) + '.</p>' +
    '<button class="btn" id="b-paid" onclick="askUTR()">I\'ve paid ✓</button>' +
    '<div id="utrbox" class="hidden"><label>Last step — UTR / UPI transaction ID</label>' +
    '<input id="t-utr" inputmode="numeric" placeholder="12-digit number" maxlength="12">' +
    '<p class="muted">Find it in your UPI app: open this payment in History — it\'s the 12-digit UTR / Ref No. This keeps ' + esc(c.display_name) + '’s wall free of fake tips.</p>' +
    '<div class="err" id="e3"></div>' +
    '<button class="btn" id="b-wall" onclick="submitTip()">Add me to the wall 🎉</button></div>' +
    '<button class="btn secondary" onclick="backToTip()">← Change amount</button></div>' +
    '<div class="card"><h2>Supporters <span class="muted" id="w-count"></span></h2><div id="wall"><p class="muted">Loading…</p></div></div>' +
    '<a class="backlink" href="#/">← Make your own TipJar page</a>';
}

function pickAmt(a, el) {
  selAmount = a;
  document.getElementById('t-custom').value = '';
  var els = document.querySelectorAll('.amt');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('sel');
  el.classList.add('sel');
}
function customAmt(el) {
  var v = parseInt(el.value.replace(/\D/g, ''), 10);
  selAmount = isNaN(v) ? 0 : v;
  var els = document.querySelectorAll('.amt');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('sel');
}
function backToTip() { document.getElementById('paycard').classList.add('hidden'); window.scrollTo(0, 0); }

function showQR() {
  hideErr('e2');
  if (!selAmount || selAmount <= 0) return showErr('e2', 'Pick or type an amount first.');
  if (selAmount > 100000) return showErr('e2', 'Keep it under ₹1,00,000 per tip 🙂');
  var c = currentCreator;
  var upiUrl = 'upi://pay?pa=' + encodeURIComponent(c.upi_id) +
               '&pn=' + encodeURIComponent(c.display_name) +
               '&am=' + selAmount.toFixed(2) + '&cu=INR&tn=' + encodeURIComponent('TipJar tip');
  document.getElementById('qr-amt').textContent = rs(selAmount);
  var box = document.getElementById('qrbox');
  box.innerHTML = '';
  try { new QRCode(box, { text: upiUrl, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { box.innerHTML = '<p class="muted">Pay to UPI ID: <b>' + esc(c.upi_id) + '</b></p>'; }
  document.getElementById('paycard').classList.remove('hidden');
  document.getElementById('paycard').scrollIntoView({ behavior: 'smooth' });
}

function askUTR() {
  document.getElementById('utrbox').classList.remove('hidden');
  document.getElementById('b-paid').classList.add('hidden');
  document.getElementById('utrbox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('t-utr').focus();
}

var justTipped = false;
async function submitTip() {
  hideErr('e3');
  var utr = document.getElementById('t-utr').value.replace(/\D/g, '');
  if (!/^\d{12}$/.test(utr)) return showErr('e3', 'That doesn\'t look like a UTR — it\'s exactly 12 digits, on your payment success screen.');
  var name = document.getElementById('t-name').value.trim() || 'Anonymous fan';
  var msg = document.getElementById('t-msg').value.trim();
  var btn = document.getElementById('b-wall'); btn.disabled = true; btn.textContent = 'Adding…';
  try {
    var res = await sb.from('tips').insert({
      creator_id: currentCreator.id, supporter_name: name.slice(0, 40),
      amount: selAmount, message: msg ? msg.slice(0, 140) : null, utr: utr
    });
    if (res.error) throw res.error;
    justTipped = true;
    await refreshTips();
    celebrate(name, selAmount);
    document.getElementById('paycard').classList.add('hidden');
    document.getElementById('utrbox').classList.add('hidden');
    document.getElementById('b-paid').classList.remove('hidden');
    document.getElementById('t-name').value = '';
    document.getElementById('t-msg').value = '';
    document.getElementById('t-custom').value = '';
    document.getElementById('t-utr').value = '';
    selAmount = 0;
    var els = document.querySelectorAll('.amt');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('sel');
  } catch (e) {
    if (e && e.code === '23505') showErr('e3', 'That UTR was already used for another tip. Double-check the number and try again.');
    else showErr('e3', 'Could not save the tip. Please try again.');
  }
  btn.disabled = false; btn.textContent = 'Add me to the wall 🎉';
}

function celebrate(name, amount) {
  var c = currentCreator;
  var ov = document.createElement('div');
  ov.id = 'celebrate';
  var pieces = '', i, x, d, dur, col;
  var cols = ['#EA580C', '#F59E0B', '#16a34a', '#ffd9a0', '#ffffff'];
  for (i = 0; i < 22; i++) {
    x = Math.random() * 100; d = (Math.random() * 0.9).toFixed(2); dur = (2 + Math.random() * 1.6).toFixed(2);
    pieces += '<span class="coin" style="left:' + x + '%;animation-delay:' + d + 's;animation-duration:' + dur + 's">' + (i % 3 ? '🪙' : '₹') + '</span>';
  }
  for (i = 0; i < 30; i++) {
    x = Math.random() * 100; d = (Math.random() * 0.7).toFixed(2); dur = (2.2 + Math.random() * 1.8).toFixed(2); col = cols[i % cols.length];
    pieces += '<span class="confetti" style="left:' + x + '%;background:' + col + ';animation-delay:' + d + 's;animation-duration:' + dur + 's"></span>';
  }
  ov.innerHTML = pieces + '<div><div class="cjar">🫙</div><h2>You\'re on the wall, ' + esc(name) + '!</h2>' +
    '<p>' + rs(amount) + ' to ' + esc(c.display_name) + ' 🎉<br>They\'ll confirm it when they\'re back — nothing more to do.</p>' +
    '<p style="font-size:13px;opacity:.75">Tap anywhere to continue</p></div>';
  document.body.appendChild(ov);
  function done() {
    if (ov.parentNode) ov.parentNode.removeChild(ov);
    var w = document.getElementById('wall');
    if (w) window.scrollTo({ top: w.offsetTop - 80, behavior: 'smooth' });
  }
  ov.addEventListener('click', done);
  setTimeout(done, 3400);
}

async function refreshTips() {
  if (!currentCreator) return;
  try {
    var res = await sb.from('tips').select('supporter_name,amount,message,created_at,verified')
      .eq('creator_id', currentCreator.id).order('created_at', { ascending: false }).limit(50);
    if (res.error) throw res.error;
    currentTips = res.data || [];
    var wall = document.getElementById('wall');
    var count = document.getElementById('w-count');
    if (count) count.textContent = currentTips.length ? '(' + currentTips.length + ')' : '';
    if (!currentTips.length) {
      wall.innerHTML = '<p class="muted">No tips yet — be the first 🙂</p>';
    } else {
      wall.innerHTML = currentTips.map(function (t, idx) {
        return '<div class="wallitem' + (justTipped && idx === 0 ? ' newtip' : '') + '"><span class="who">' + esc(t.supporter_name) + '</span> ' +
               '<span class="amt2">' + rs(t.amount) + '</span>' +
               (t.verified ? '<span class="tag ok">✓ confirmed</span>' : '<span class="tag wait">awaiting confirmation</span>') +
               (t.message ? '<div class="msg">“' + esc(t.message) + '”</div>' : '') +
               '<div class="when">' + timeAgo(t.created_at) + '</div></div>';
      }).join('');
      justTipped = false;
    }
    if (currentCreator.goal_amount) {
      var raised = currentTips.reduce(function (s, t) { return s + (t.verified ? t.amount : 0); }, 0);
      var pendingAmt = currentTips.reduce(function (s, t) { return s + (t.verified ? 0 : t.amount); }, 0);
      var pct = Math.min(100, Math.round(raised / currentCreator.goal_amount * 100));
      var bar = document.getElementById('g-bar'), rg = document.getElementById('g-raised');
      var gp = document.getElementById('g-pending');
      if (bar) bar.style.width = pct + '%';
      if (rg) rg.textContent = rs(raised);
      if (gp) gp.textContent = pendingAmt > 0 ? '+' + rs(pendingAmt) + ' awaiting confirmation' : '';
    }
  } catch (e) { /* keep old wall on transient errors */ }
}

/* ---------- creator confirm page ---------- */
async function renderConfirm(token) {
  app.innerHTML = '<p class="center muted">Loading…</p>';
  try {
    var res = await sb.rpc('pending_tips', { p_token: token });
    if (res.error) throw res.error;
    var tips = res.data || [];
    if (!tips.length) {
      app.innerHTML = '<div class="card center"><h2>All caught up 🎉</h2>' +
        '<p class="muted">No tips are waiting for confirmation right now. When a supporter tips you, they\'ll show up here — open this same link any time (no login needed). Keep the link private and saved!</p>' +
        '<a class="backlink" href="#/">← TipJar home</a></div>';
      return;
    }
    app.innerHTML = '<div class="card"><h2>Confirm your tips</h2>' +
      '<p class="muted">These supporters say they paid you. Check your UPI app — the UTR should match a real payment — then confirm. Only confirmed tips count toward your goal.</p>' +
      tips.map(function (t) {
        return '<div class="wallitem"><span class="who">' + esc(t.supporter_name) + '</span> ' +
               '<span class="amt2">' + rs(t.amount) + '</span>' +
               (t.message ? '<div class="msg">“' + esc(t.message) + '”</div>' : '') +
               '<div class="when">UTR ' + esc(t.utr || '—') + ' · ' + timeAgo(t.created_at) + '</div></div>';
      }).join('') +
      '<div class="err" id="e4"></div>' +
      '<button class="btn" id="b-confirm" onclick="doConfirmAll(\'' + token + '\')">Confirm all ✓</button></div>' +
      '<a class="backlink" href="#/">← TipJar home</a>';
  } catch (e) {
    app.innerHTML = '<div class="card center"><h2>Link not working</h2>' +
      '<p class="muted">This confirmation link looks invalid. Check you copied the whole link from your signup page.</p>' +
      '<a class="backlink" href="#/">← TipJar home</a></div>';
  }
}
async function doConfirmAll(token) {
  var btn = document.getElementById('b-confirm'); btn.disabled = true; btn.textContent = 'Confirming…';
  try {
    var res = await sb.rpc('confirm_all_tips', { p_token: token });
    if (res.error) throw res.error;
    app.innerHTML = '<div class="card center"><h2>Done 🎉</h2>' +
      '<p class="muted">' + res.data + ' tip(s) confirmed. They now count toward your goal.</p>' +
      '<a class="backlink" href="#/">← TipJar home</a></div>';
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Confirm all ✓';
    showErr('e4', 'Something went wrong. Please try again.');
  }
}

route();
</script>
